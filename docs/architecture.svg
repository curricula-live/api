<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">curricula.live API architecture</title>
  <desc id="desc">Clients call a Django API that currently exposes health and admin surfaces and connects to PostgreSQL through an environment-provided database URL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4e9"/>
      <stop offset="1" stop-color="#e6efe7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#23382f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#426556"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <text x="60" y="70" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#213e34">curricula.live API</text>
  <text x="60" y="108" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526a61">Django foundation for a curriculum knowledge and recommendation platform</text>

  <g filter="url(#shadow)">
    <rect x="65" y="175" width="230" height="200" rx="22" fill="#fffdf8" stroke="#c9d6cc" stroke-width="2"/>
    <rect x="365" y="145" width="330" height="260" rx="22" fill="#fffdf8" stroke="#c9d6cc" stroke-width="2"/>
    <rect x="765" y="175" width="210" height="200" rx="22" fill="#fffdf8" stroke="#c9d6cc" stroke-width="2"/>
    <rect x="1025" y="175" width="110" height="200" rx="22" fill="#fffdf8" stroke="#c9d6cc" stroke-width="2"/>
  </g>

  <text x="180" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#294b3f">Clients</text>
  <text x="180" y="260" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536b62">Web application</text>
  <text x="180" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536b62">Admin users</text>
  <text x="180" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536b62">Health monitors</text>

  <text x="530" y="190" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#294b3f">Django 5.2</text>
  <text x="530" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">URL routing</text>
  <text x="530" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Core application</text>
  <text x="530" y="301" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Admin and authentication foundation</text>
  <text x="530" y="334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Environment-based configuration</text>
  <text x="530" y="367" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">WSGI / ASGI entry points</text>

  <text x="870" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#294b3f">PostgreSQL</text>
  <text x="870" y="260" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536b62">Supabase-compatible</text>
  <text x="870" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536b62">psycopg 3</text>
  <text x="870" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536b62">DATABASE_URL</text>

  <text x="1080" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#294b3f">Tests</text>
  <text x="1080" y="260" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536b62">pytest</text>
  <text x="1080" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536b62">SQLite</text>
  <text x="1080" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536b62">isolated</text>

  <line x1="295" y1="275" x2="355" y2="275" stroke="#426556" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="695" y1="275" x2="755" y2="275" stroke="#426556" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="975" y1="275" x2="1015" y2="275" stroke="#426556" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="365" y="440" width="610" height="48" rx="16" fill="#d8e7dd"/>
  <text x="670" y="471" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#294b3f">Current public surface: /health/ and /admin/ — domain endpoints are still being built</text>
</svg>
