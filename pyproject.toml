[project]
name = "curricula-live-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.16",
    "djangorestframework==3.17.1",
    "django-filter==26.1",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.4",
    "typing-extensions==4.16.0",
    "gunicorn==26.0.0",
    "whitenoise==6.11.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.12.0",
]

[tool.vercel]
entrypoint = "config.wsgi:application"
